name: Public package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      # Consumers of the Git dependency need prepare to generate dist. CI builds it explicitly once.
      - run: npm ci --ignore-scripts
      - if: matrix.react == '18'
        run: npm install --ignore-scripts --no-save --package-lock=false react@18.3.1 react-dom@18.3.1 @types/react@18.3.27 @types/react-dom@18.3.7
      - run: npm run build
      - run: npm run typecheck
      - run: npm run studio:typecheck
      - run: npm run studio:build
      - run: npm run test:built
      - run: npm pack --dry-run --ignore-scripts
